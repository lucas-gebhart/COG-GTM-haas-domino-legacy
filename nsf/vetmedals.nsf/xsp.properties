# XPages runtime properties - vetmedals.nsf
# Application Properties > XPages tab (Domino Designer 8.5.3, runtime upgraded to 12.0.2)
xsp.theme=webstandard
xsp.theme.web=webstandard
xsp.html.doctype=HTML 4.01 Transitional
xsp.html.meta.contenttype=text/html;charset=UTF-8
xsp.application.timeout=30
xsp.session.timeout=30
xsp.persistence.mode=file
xsp.persistence.file.maxviews=8
xsp.persistence.tree.maxviews=4
xsp.persistence.file.gzip=true
xsp.persistence.file.async=true
xsp.persistence.dir.xspstate=/xspstate
xsp.persistence.dir.xspupload=/xspupload
xsp.persistence.file.threshold=32768
xsp.error.page.default=true
xsp.error.page=/Error.xsp
xsp.client.script.dojo.version=1.9.7
xsp.client.script.libraries=dojo
xsp.client.validation=false
xsp.resources.aggregate=true
xsp.compress.mode=gzip-nocache
xsp.ajax.renderwholetree=false
xsp.library.depends=com.ibm.xsp.extlib.library
xsp.richtext.default.htmlfilter=acf
xsp.richtext.default.htmlfilterin=acf
xsp.partial.update.timeout=20
xsp.upload.maximumsize=20480
xsp.upload.directory=/xspupload
# Legacy: turned off in 2014 after EAMS-A redirect loop; do not re-enable
xsp.session.transient=false
# Character set for the packing-slip print view
xsp.html.page.encoding=UTF-8
